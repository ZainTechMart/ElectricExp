<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Electric Circuit Virtual Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    canvas { background: #1e293b; border-radius: 12px; max-width: 100%; height: auto; }
  </style>
</head>
<body class="p-4 sm:p-6">
  <div class="max-w-4xl mx-auto">
    <h1 class="text-2xl sm:text-3xl font-bold text-cyan-400 mb-2 text-center">Interactive Electric Circuit Simulator</h1>
    <p class="text-slate-400 text-center mb-6 text-sm sm:text-base">Real-time Ohm's Law & Circuit Simulation</p>

    <div class="bg-slate-800 p-4 rounded-xl mb-4 flex justify-between items-center flex-wrap gap-4 shadow-lg">
      <div class="w-full sm:w-auto flex-1">
        <label class="text-sm font-medium text-slate-300">Voltage (V): <span id="vVal" class="text-yellow-400 font-bold">9V</span></label>
        <input type="range" id="voltage" min="1" max="24" value="9" class="w-full accent-cyan-400">
      </div>
      <div class="w-full sm:w-auto flex-1">
        <label class="text-sm font-medium text-slate-300">Resistance (Ω): <span id="rVal" class="text-cyan-400 font-bold">10Ω</span></label>
        <input type="range" id="resistance" min="1" max="100" value="10" class="w-full accent-cyan-400">
      </div>
      <div class="w-full sm:w-auto text-center">
        <button id="toggleSwitch" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-lg font-bold transition shadow-md">Switch: ON</button>
      </div>
    </div>

    <div class="relative flex justify-center bg-slate-900 p-2 rounded-2xl border border-slate-700 shadow-2xl overflow-hidden">
      <canvas id="circuitCanvas" width="700" height="400"></canvas>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4 text-center">
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
        <div class="text-slate-400 text-xs font-semibold tracking-wider">CURRENT (I)</div>
        <div id="iDisplay" class="text-2xl font-extrabold text-emerald-400 mt-1">0.90 A</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
        <div class="text-slate-400 text-xs font-semibold tracking-wider">POWER (P)</div>
        <div id="pDisplay" class="text-2xl font-extrabold text-yellow-400 mt-1">8.10 W</div>
      </div>
      <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
        <div class="text-slate-400 text-xs font-semibold tracking-wider">BULB STATE</div>
        <div id="bDisplay" class="text-2xl font-extrabold text-cyan-400 mt-1">Glowing</div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('circuitCanvas');
    const ctx = canvas.getContext('2d');

    let voltage = 9;
    let resistance = 10;
    let switchOn = true;
    let particleOffset = 0;

    document.getElementById('voltage').addEventListener('input', (e) => {
      voltage = parseFloat(e.target.value);
      document.getElementById('vVal').innerText = voltage + 'V';
      updateMetrics();
    });

    document.getElementById('resistance').addEventListener('input', (e) => {
      resistance = parseFloat(e.target.value);
      document.getElementById('rVal').innerText = resistance + 'Ω';
      updateMetrics();
    });

    document.getElementById('toggleSwitch').addEventListener('click', () => {
      switchOn = !switchOn;
      const btn = document.getElementById('toggleSwitch');
      btn.innerText = switchOn ? "Switch: ON" : "Switch: OFF";
      btn.className = switchOn 
        ? "w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white px-5 py-2.5 rounded-lg font-bold transition shadow-md" 
        : "w-full sm:w-auto bg-rose-600 hover:bg-rose-500 text-white px-5 py-2.5 rounded-lg font-bold transition shadow-md";
      updateMetrics();
    });

    function updateMetrics() {
      const current = switchOn ? (voltage / resistance) : 0;
      const power = switchOn ? (voltage * current) : 0;
      document.getElementById('iDisplay').innerText = current.toFixed(2) + ' A';
      document.getElementById('pDisplay').innerText = power.toFixed(2) + ' W';
      document.getElementById('bDisplay').innerText = switchOn ? "Glowing" : "OFF";
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Wire Loop
      ctx.strokeStyle = "#475569";
      ctx.lineWidth = 6;
      ctx.strokeRect(100, 80, 500, 240);

      // Battery (Left Side)
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(80, 160, 40, 80);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(90, 165, 20, 30);
      ctx.fillStyle = "#3b82f6";
      ctx.fillRect(90, 205, 20, 30);
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("+", 95, 185);
      ctx.fillText("-", 96, 225);

      // Switch (Top Side)
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(320, 70, 60, 20);
      ctx.strokeStyle = switchOn ? "#10b981" : "#f43f5e";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(330, 80);
      ctx.lineTo(switchOn ? 370 : 365, switchOn ? 80 : 65);
      ctx.stroke();

      // Bulb (Right Side)
      const current = switchOn ? (voltage / resistance) : 0;
      const glow = Math.min(1, current / 2);
      ctx.beginPath();
      ctx.arc(600, 200, 25, 0, Math.PI * 2);
      ctx.fillStyle = switchOn ? `rgba(253, 224, 71, ${0.3 + glow * 0.7})` : "#334155";
      ctx.fill();
      ctx.strokeStyle = switchOn ? "#fde047" : "#64748b";
      ctx.lineWidth = 3;
      ctx.stroke();

      // Filament
      ctx.beginPath();
      ctx.moveTo(590, 210);
      ctx.lineTo(600, 190);
      ctx.lineTo(610, 210);
      ctx.strokeStyle = switchOn ? "#ffffff" : "#94a3b8";
      ctx.lineWidth = 2;
      ctx.stroke();

      // Electron Flow Animation
      if (switchOn && current > 0) {
        particleOffset = (particleOffset + current * 2) % 20;
        ctx.fillStyle = "#38bdf8";
        
        const pts = [
          ...getPath(100, 80, 600, 80),   // Top
          ...getPath(600, 80, 600, 320),  // Right
          ...getPath(600, 320, 100, 320), // Bottom
          ...getPath(100, 320, 100, 80)   // Left
        ];

        pts.forEach((p, idx) => {
          if ((idx * 20 + particleOffset) % 30 < 15) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      requestAnimationFrame(draw);
    }

    function getPath(x1, y1, x2, y2) {
      const pts = [];
      const steps = 15;
      for (let i = 0; i <= steps; i++) {
        pts.push({ x: x1 + (x2 - x1) * (i / steps), y: y1 + (y2 - y1) * (i / steps) });
      }
      return pts;
    }

    updateMetrics();
    draw();
  </script>
</body>
</html>
